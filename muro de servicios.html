    <style>
        :root {
            --primary: #007bff;
            --neon-blue: #00e1ff;
            --dark-bg: #0a0a10;
            --panel-bg: rgba(20, 20, 35, 0.98);
            --text-white: #ffffff;
            --danger: #ff4d4d;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #05050a url('https://img.freepik.com/free-photo/abstract-luxury-gradient-blue-background-smooth-dark-blue-with-black-vignette_1258-48251.jpg') no-repeat fixed center;
            background-size: cover;
            color: var(--text-white);
            min-height: 100vh;
        }

        /* --- NAVBAR PREMIUM --- */
        .navbar {
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .brand {
            font-size: 1.4em;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-white);
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-publish {
            background: linear-gradient(45deg, var(--primary), var(--neon-blue));
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
        }
        .btn-publish:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--neon-blue); color: #000; }

        .wall-container {
            max-width: 1440px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* --- BUSCADOR Y FILTROS --- */
        .search-box {
            max-width: 600px;
            margin: 20px auto;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 40px;
            border: 2px solid var(--glass);
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 225, 255, 0.2); }

        /* Barra de categorías deslizable mejorada */
        .nav-scroll-container {
            width: 100%;
            overflow-x: auto;
            padding: 15px 0;
            scrollbar-width: none; /* Firefox */
        }
        .nav-scroll-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .category-filter {
            display: flex;
            gap: 12px;
            padding: 0 10px;
            width: max-content;
        }

        .filter-btn {
            background: var(--glass);
            color: #eee;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.2); }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--primary);
            color: white;
        }

        /* --- GRID DE SERVICIOS --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .services-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-img { height: 130px !important; }
            .card-title { font-size: 0.95em !important; }
        }

        .service-card {
            background: var(--panel-bg);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .service-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        .card-img { width: 100%; height: 180px; object-fit: cover; cursor: zoom-in; transition: 0.5s; }
        .service-card:hover .card-img { filter: brightness(1.1); }

        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-tag { font-size: 0.7em; font-weight: bold; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 5px; }
        .card-title { font-size: 1.15em; margin: 5px 0; color: #fff; letter-spacing: 0.5px; }
        .card-desc { font-size: 0.85em; color: #bbb; line-height: 1.4; margin-bottom: 15px; }

        .card-footer { display: flex; gap: 8px; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .btn-wa { 
            flex-grow: 1; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            text-align: center; 
            padding: 10px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* MODALES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(10px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #151520; padding: 30px; border-radius: 20px; width: 90%; max-width: 480px; border: 1px solid var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--neon-blue); font-size: 0.9em; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 10px; font-size: 1rem; }

        #imageViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 3000; justify-content: center; align-items: center; }
        #imageViewer img { max-width: 95%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 30px var(--primary); }
    </style>
</head>

            const fullImg = document.getElementById('fullImage');
            fullImg.src = src;
            viewer.style.display = 'flex';
        }

        document.getElementById('serviceForm').onsubmit = function(e) {
            e.preventDefault();
            const file = document.getElementById('servImg').files[0];
            const reader = new FileReader();
            
            const publish = (img) => {
                servicesRef.push({
                    category: document.getElementById('servCat').value,
                    title: document.getElementById('servTitle').value,
                    desc: document.getElementById('servDesc').value,
                    phone: document.getElementById('servPhone').value,
                    image: img || 'https://via.placeholder.com/400x300?text=MS+Servicio',
                    timestamp: Date.now()
                });
                closeModal();
                document.getElementById('serviceForm').reset();
            };

            if(file) {
                if(file.size > 1000000) { alert("Imagen demasiado grande (máx 1MB)"); return; }
                reader.onloadend = () => publish(reader.result);
                reader.readAsDataURL(file);
            } else { publish(); }
        };

        servicesRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const list = [];
            for(let key in data) { list.push({ id: key, ...data[key] }); }
            window.allServices = list.reverse();
            render(window.allServices);
        });

        function render(services) {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            
            if(services.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#666;">No se encontraron servicios.</div>';
                return;
            }

            services.forEach(s => {
                const waUrl = `https://wa.me/${s.phone}?text=Hola%20${encodeURIComponent(s.title)},%20vi%20tu%20perfil%20en%20Multi%20Service%20MS.%20Solicito%20información.`;
                grid.innerHTML += `
                    <div class="service-card">
                        <img src="${s.image}" class="card-img" onclick="viewImg(this.src)">
                        <div class="card-body">
                            <span class="card-tag">${s.category}</span>
                            <h3 class="card-title">${s.title}</h3>
                            <p class="card-desc">${s.desc}</p>
                            <div class="card-footer">
                                <a href="${waUrl}" target="_blank" class="btn-wa">
                                    <i class="fab fa-whatsapp"></i> CONTACTAR
                                </a>
                                <button class="btn-action" onclick="deleteService('${s.id}')" style="background:none; border:none; color:#444; cursor:pointer;">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function deleteService(id) {
            if (prompt("PIN de seguridad para eliminar:") === DELETE_CODE) {
                servicesRef.child(id).remove();
            }
        }

        function filterByCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(cat === 'all') {
                render(window.allServices);
            } else {
                render(window.allServices.filter(s => s.category === cat));
            }
        }

        function filterServices() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const filtered = window.allServices.filter(s => 
                s.title.toLowerCase().includes(text) || 
                s.category.toLowerCase().includes(text) || 
                s.desc.toLowerCase().includes(text)
            );
            render(filtered);
        }
    </script>
</body>
</html>
